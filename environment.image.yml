# Environnement de l'image gemprot (Dockerfile). Versions figées ; vep 115 = version du cache.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.9
  - pip
  - typer=0.27.3
  - pyyaml=6.0.3
  - jinja2=3.1.6
  - pytest=9.1.1
  - ensembl-vep=115.2
  - bcftools=1.21
  - htslib=1.21
  - samtools=1.21
  - whatshap=2.8
  - hiphase=1.7.0
  - shapeit5=5.1.1
